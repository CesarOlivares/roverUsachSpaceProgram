<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.8">
  <circle cx="50" cy="50" r="38" />
  <!-- Overlapping rotated squares forming octagram -->
  <rect x="23" y="23" width="54" height="54" />
  <rect x="23" y="23" width="54" height="54" transform="rotate(45 50 50)" />
  <!-- Cardinal directional arrows -->
  <line x1="50" y1="6" x2="50" y2="94" stroke-width="1.2" />
  <line x1="6" y1="50" x2="94" y2="50" stroke-width="1.2" />
  <polygon points="50,4 47,12 53,12" fill="currentColor" />
  <polygon points="50,96 47,88 53,88" fill="currentColor" />
  <polygon points="4,50 12,47 12,53" fill="currentColor" />
  <polygon points="96,50 88,47 88,53" fill="currentColor" />
</svg>
