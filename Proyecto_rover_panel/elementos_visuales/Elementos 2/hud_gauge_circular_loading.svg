    <rect x="248" y="46" width="16" height="42" rx="2" fill-opacity="0.15" />
    <rect x="270" y="46" width="16" height="42" rx="2" fill-opacity="0.15" />
    <rect x="292" y="46" width="16" height="42" rx="2" fill-opacity="0.15" />
