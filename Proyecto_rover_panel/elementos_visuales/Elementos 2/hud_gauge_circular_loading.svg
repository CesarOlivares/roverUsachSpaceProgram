    <rect x="116" y="46" width="16" height="42" rx="2" />
    <rect x="138" y="46" width="16" height="42" rx="2" />
    <rect x="160" y="46" width="16" height="42" rx="2" />
    <rect x="182" y="46" width="16" height="42" rx="2" />
    <rect x="204" y="46" width="16" height="42" rx="2" />
    <!-- Empty remaining slots -->
