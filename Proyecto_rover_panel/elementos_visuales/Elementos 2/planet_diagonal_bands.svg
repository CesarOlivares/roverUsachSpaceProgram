<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140">
  <defs>
    <clipPath id="banded-planet-clip">
      <circle cx="70" cy="70" r="48" />
    </clipPath>
  </defs>
  <!-- Sphere Border -->
  <circle cx="70" cy="70" r="48" fill="none" stroke="currentColor" stroke-width="2.5" />
  <!-- Atmospheric Diagonal Parallel Bands -->
  <g clip-path="url(#banded-planet-clip)" fill="currentColor">
    <polygon points="10,40 130,-80 145,-65 25,55" />
    <polygon points="15,75 140,-50 155,-35 30,90" />
    <polygon points="25,108 145,-12 165,8 45,128" />
    <polygon points="50,140 160,30 175,45 65,155" />
    <!-- Fine Secondary Stripes -->
    <line x1="20" y1="62" x2="140" y2="-58" stroke="currentColor" stroke-width="2" />
    <line x1="36" y1="98" x2="156" y2="-22" stroke="currentColor" stroke-width="2" />
  </g>
</svg>
