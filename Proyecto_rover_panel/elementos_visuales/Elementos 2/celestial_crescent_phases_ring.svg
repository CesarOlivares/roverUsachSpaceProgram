<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="currentColor">
  <!-- Minimalist DailyMinimal Style: Central Compass Line -->
  <line x1="80" y1="10" x2="80" y2="150" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <!-- Primary Orbit Circle -->
  <circle cx="80" cy="80" r="56" fill="none" stroke="currentColor" stroke-width="1.8" />
  <!-- Secondary Inner Dashed Guide -->
  <circle cx="80" cy="80" r="42" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
  <!-- Central Sun / Star Point -->
  <circle cx="80" cy="80" r="7" fill="none" stroke="currentColor" stroke-width="2.5" />
  <circle cx="80" cy="80" r="2.5" />
  <!-- Top Moon (Full) -->
  <circle cx="80" cy="24" r="8" fill="#fff" stroke="currentColor" stroke-width="2" />
  <!-- Bottom Moon (New Moon Outline) -->
  <circle cx="80" cy="136" r="8" fill="none" stroke="currentColor" stroke-width="2" />
  <!-- Right Moon (First Quarter / Waxing Crescent) -->
  <g transform="translate(136, 80)">
    <circle cx="0" cy="0" r="8" fill="none" stroke="currentColor" stroke-width="2" />
    <path d="M 0 -8 A 8 8 0 0 1 0 8 Z" fill="currentColor" />
  </g>
  <!-- Left Moon (Third Quarter / Waning) -->
  <g transform="translate(24, 80)">
    <circle cx="0" cy="0" r="8" fill="none" stroke="currentColor" stroke-width="2" />
    <path d="M 0 -8 A 8 8 0 0 0 0 8 Z" fill="currentColor" />
  </g>
</svg>
