<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" stroke="currentColor">
  <!-- Outer Chamfered Cyber Frame -->
  <polygon points="44,16 304,16 304,156 272,188 16,188 16,44" stroke-width="2.5" />
  <!-- Top-Left Corner Cutout Tab -->
  <polygon points="16,44 44,16 68,16 68,44 16,44" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1.5" />
  <!-- Red/Accent Diagonal Warning Hatch inside Tab -->
  <g stroke="currentColor" stroke-width="2">
    <line x1="24" y1="40" x2="40" y2="24" />
    <line x1="34" y1="40" x2="50" y2="24" />
    <line x1="44" y1="40" x2="60" y2="24" />
