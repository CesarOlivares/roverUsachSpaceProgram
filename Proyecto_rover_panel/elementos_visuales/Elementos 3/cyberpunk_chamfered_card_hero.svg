  <!-- Corner Gripper Brackets -->
  <polyline points="290,36 300,36 300,46" stroke-width="3" stroke-linecap="round" />
  <polyline points="300,146 300,156 290,166" stroke-width="3" stroke-linecap="round" />
  <polyline points="36,188 16,188 16,168" stroke-width="3" stroke-linecap="round" />
  <!-- Terminal Target Icon (Bottom Right) -->
  <rect x="238" y="148" width="18" height="18" stroke-width="1.5" />
  <line x1="238" y1="148" x2="256" y2="166" stroke-width="1.5" />
  <line x1="256" y1="148" x2="238" y2="166" stroke-width="1.5" />
</svg>
