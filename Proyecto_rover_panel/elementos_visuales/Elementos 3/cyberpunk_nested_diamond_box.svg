<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" fill="none" stroke="currentColor">
  <!-- Outer Box Frame -->
  <rect x="18" y="18" width="104" height="104" stroke-width="3" />
  <!-- Concentric Inner Box Frame -->
  <rect x="28" y="28" width="84" height="84" stroke-width="1.2" stroke-dasharray="4 3" />
  <!-- Diamond Rhombus Inset -->
  <polygon points="70,32 108,70 70,108 32,70" stroke-width="2" fill="currentColor" fill-opacity="0.12" />
  <!-- Diagonal X Arms -->
  <line x1="28" y1="28" x2="112" y2="112" stroke-width="2" />
  <line x1="112" y1="28" x2="28" y2="112" stroke-width="2" />
  <!-- Center Negative Core Box -->
  <rect x="62" y="62" width="16" height="16" fill="currentColor" stroke="none" />
</svg>
